# Géométrie du montage semi-statique — source : cahier de laboratoire (vault)
# §0.1 (indexation des passes), §1.2.3 (générateur/MFC), Série A/B (empilement)

laminate:
  longueur: 0.120            # m — axe x (direction des passes)
  largeur: 0.040             # m — axe y
  epaisseur_sup: 0.00336     # m — laminé supérieur [45/-45/0/90]3s (+ twill interface)
  epaisseur_film: 0.0001     # m — film PEKK 0,004 po
  epaisseur_inf: 0.00336     # m — laminé inférieur
  # z = 0 : surface supérieure (côté bobine) ; z croît vers le bas

coil:
  # Bobine hairpin (épingle) Ambrell — d'après la CAO du montage
  # (positionnement_CFC+coil.png, échelle = MFC 55 mm) : deux tubes de cuivre
  # carrés de 6 mm de côté traversant le MFC le long de son grand côté
  # (CONFIRMÉ user 2026-07-23 ; l'ancienne valeur ~9,5 mm / 3/8 po était fausse).
  type: hairpin
  longueur_jambe: 0.055      # m — brins parallèles au grand côté du MFC (55 mm)
  entraxe_jambes: 0.01235    # m — centre à centre = tube 6 mm + gap 6,35 mm
                             # (CONFIRMÉ user 2026-07-23 ; ancienne valeur 0.019
                             # supposait à tort un tube 9,5 mm)
  rayon_tube: 0.003          # m — demi-côté du tube carré 6 mm (filament équivalent ;
                             # n'entre que dans plan_miroir_cfc = hauteur + rayon_tube)
  # Hauteur de l'axe du conducteur au-dessus de la surface du laminé =
  # gap céramique 2 mm + demi-tube 3 mm (tube carré 6 mm). CORRIGÉ 2026-07-27 :
  # l'ancienne valeur 0.0068 était une SÉQUELLE du tube 9,5 mm (2 + 4,76 = 6,76,
  # cf. commit d'origine 55068a6) — pas une mesure. La photo de montage
  # (photo_montage_zoom_coil_lamines.jpg) montre les brins posés au ras de la
  # céramique. Plan image du MFC (plan_miroir_cfc = hauteur + rayon_tube) reste
  # au sommet des brins, confirmé par la même photo — cf.
  # resultats_diag_hauteur_bobine.log §6.
  hauteur: 0.005             # m
  # CONFIRMÉ (2026-07-17) : le grand côté 55 mm du MFC est parallèle à la
  # LARGEUR des échantillons (axe y) => brins du hairpin le long de y.
  orientation: y
  # Décalage du centre de la bobine par rapport au centre_x nominal du spot,
  # le long de x (m). L'incertitude de positionnement bobine/MFC/thermocouples
  # au montage n'est PAS mesurée (cahier §2.1.4, pas de cartographie relative
  # bobine<->MFC<->TC) : seule la position CAO nominale (decalage_x=0) est
  # connue. Le hairpin a un zéro de dissipation exact sur son plan de symétrie
  # (2026-07-18, validation TC2) : un décalage bobine/montage de quelques mm
  # déplace ce zéro et change fortement le taux de chauffe local (5,7 ->
  # 13,2 °C/s au TC2 pour +10 mm, essai chauffe_250A_3TC). Bornes physiques
  # plausibles ±0,015 m (le MFC fait 31,5 mm le long de x : la bobine ne peut
  # pas sortir de son empreinte). À IDENTIFIER PAR CALIBRATION tant qu'aucune
  # mesure de position n'existe ; ne pas figer arbitrairement à 0.
  decalage_x: 0.0            # m

cfc:
  # Concentrateur de flux Fluxtrol Ferrotron 559H, mu_r ~ 16
  longueur: 0.055            # m — MFC labo (essais A/B) ; MFC réduit commandé : 0.03175
  largeur: 0.0315            # m
  hauteur: 0.012             # m
  mu_r: 16.0
  # CONFIRMÉ (2026-07-17) : grande longueur 55 mm parallèle à la largeur des
  # échantillons (y) ; côté 31,5 mm le long du déplacement (x) — cohérent avec
  # l'empreinte de passe w = 31,75 mm du cahier §0.1

generateur:
  modele: "Ambrell EASYHEAT 4.2 kW"
  # Fréquence GLOBALE (relevé machine). MESURE 2026-07-28 sur 5 courants :
  # 150->390, 176->387, 200->390, 225->388, 250->386 kHz = CONSTANTE 388±2 kHz,
  # aucune tendance avec I (corr -0,63 = bruit). => la fréquence NE varie PAS avec
  # l'ampérage : l'ancien relevé "200 A = 383 kHz" est infirmé, et la "correction
  # fréquence par essai" est ABANDONNÉE (une seule valeur globale suffit). Confirme
  # aussi la loi en I² de la source (cf. docs/labo/figures/presentation_fig5).
  frequence: 388.0e+3        # Hz — constante mesurée 388±2 kHz sur 150-250 A
  courant_max: 600.0         # A

empreintes:
  # Passe 1 — 4 empreintes le long des 120 mm (cahier §0.1).
  # Réglage réellement utilisé pour A/B : pas de 30 mm (Tableau 2).
  # Consigne corrigée (Tableau 3, prochains essais) : pas de 29,42 mm.
  centres_pas30: [0.015875, 0.045875, 0.075875, 0.105875]     # m
  centres_corriges: [0.015875, 0.04529, 0.07471, 0.104125]    # m
