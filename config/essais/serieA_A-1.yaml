# Essai A-1 — baseline squeeze-out, 250 A, 70 N, 4 empreintes séquentielles
# Source : cahier de labo §1.3 (fiche A-1) ; TC1 = Surface, TC2-TC5 = Interface
# (convention du notebook tracer_courbes_thermocouples).
nom: serieA_A-1
fichier_mesures: data/serieA_A-1_250A_2026-06-05.csv
courant: 250.0               # A
# Coupure sur consigne : « chauffe à 250 A jusqu'à T_processing » (fiche A-1,
# T max interface 398 °C) — la source est asservie à cette température.
consigne_interface: 400.0    # °C
duree_chauffe: 302.0         # s CUMULÉS de chauffe effective (4 impulsions détectées)
duree_totale: 1420.0         # s simulés (le CSV fait 1423 points à 1 Hz)
spots:
  # 4 empreintes au pas de 30 mm. Fenêtres d'impulsion DÉTECTÉES sur les
  # courbes TC (seuil dT/dt lissé > 1 °C/s, fusion < 20 s) : le générateur est
  # coupé entre les empreintes (repositionnement), les TC retombent vers ~40 °C.
  - {centre_x: 0.015875, t_debut: 0.0,    t_fin: 79.0}
  - {centre_x: 0.045875, t_debut: 393.0,  t_fin: 473.0}
  - {centre_x: 0.075875, t_debut: 761.0,  t_fin: 820.0}
  - {centre_x: 0.105875, t_debut: 1085.0, t_fin: 1169.0}
thermocouples:
  # HYPOTHÈSE À CONFIRMER AU CAHIER : TC1 en surface au spot 1 ; TC2-TC5 à
  # l'interface, un par empreinte (ordre spatial supposé = ordre des spots).
  # ⚠ L'affectation TC↔position VARIE PAR ESSAI (constat 2026-07-12 : voie du
  # pic = TC1 en A-1, TC4 en A-2, TC2 en A-3, TC5 en B-1, TC3 en B-2).
  # Tant que ce n'est pas tranché au cahier, utiliser les Séries A/B en
  # validation QUALITATIVE (T max globale, formes) plutôt qu'en RMSE par voie.
  TC1: {x: 0.015875, y: 0.020, z: surface}
  TC2: {x: 0.015875, y: 0.020, z: interface}
  TC3: {x: 0.045875, y: 0.020, z: interface}
  TC4: {x: 0.075875, y: 0.020, z: interface}
  TC5: {x: 0.105875, y: 0.020, z: interface}
tc_valides: [TC1, TC2, TC3, TC4, TC5]
