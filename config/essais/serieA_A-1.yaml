# Essai A-1 — baseline squeeze-out, 250 A, 70 N, 4 empreintes séquentielles
# Source : cahier de labo §1.3 (fiche A-1). Les 5 TC sont à l'INTERFACE ; TC1 au
# centre de largeur (y=20 mm) et au bord de longueur (x=0), TC2-TC5 au bord de
# largeur (y=0). Position TC1 confirmée terrain le 2026-08-04 (issue #8). L'ancien
# en-tête « TC1 = Surface » était erroné (cf. bloc thermocouples ci-dessous).
nom: serieA_A-1
fichier_mesures: data/Serie A/serieA_A-1_250A_2026-06-05.csv
courant: 250.0               # A
# Coupure sur consigne : « chauffe à 250 A jusqu'à T_processing » (fiche A-1,
# T max interface 398 °C) — la source est asservie à cette température.
consigne_interface: 400.0    # °C
duree_chauffe: 302.0         # s CUMULÉS de chauffe effective (4 impulsions détectées)
duree_totale: 1420.0         # s simulés (le CSV fait 1423 points à 1 Hz)
spots:
  # 4 empreintes au pas de 30 mm. Fenêtres d'impulsion DÉTECTÉES sur les
  # courbes TC (seuil dT/dt lissé > 1 °C/s, fusion < 20 s) : le générateur est
  # coupé entre les empreintes (repositionnement), les TC retombent vers ~40 °C.
  - {centre_x: 0.015875, t_debut: 0.0,    t_fin: 79.0}
  - {centre_x: 0.045875, t_debut: 393.0,  t_fin: 473.0}
  - {centre_x: 0.075875, t_debut: 761.0,  t_fin: 820.0}
  - {centre_x: 0.105875, t_debut: 1085.0, t_fin: 1169.0}
thermocouples:
  # Positions CONFIRMÉES par l'utilisateur (2026-07-20) : les 5 TC sont TOUS à
  # l'interface. Référentiel cahier (x=longueur, z=largeur) origine au MILIEU de
  # l'échantillon 120×40 mm ; converti au repère modèle (origine coin) par
  # x_m = x_cahier + 60 mm, y_m = z_cahier + 20 mm :
  #   TC1(-60,0)  TC2(-30,-20)  TC3(0,-20)  TC4(30,-20)  TC5(60,-20)
  # → TC2-TC5 au BORD de largeur (y=0, lobes chauds du profil « M ») ; TC1 au
  # centre de largeur et au bord de longueur. (Remplace l'ancienne hypothèse
  # TC1=surface / TC alignés sur les spots, qui était erronée.)
  TC1: {x: 0.000, y: 0.020, z: interface}
  TC2: {x: 0.030, y: 0.000, z: interface}
  TC3: {x: 0.060, y: 0.000, z: interface}
  TC4: {x: 0.090, y: 0.000, z: interface}
  TC5: {x: 0.120, y: 0.000, z: interface}
tc_valides: [TC1, TC2, TC3, TC4, TC5]
