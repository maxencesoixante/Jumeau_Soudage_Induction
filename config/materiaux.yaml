# Propriétés matériaux — sources : vault Obsidian Memoire_Soudage_Induction
#   - CF/PEKK Solvay APC (PEKK-FC) : CLAUDE.md §3 du vault + notebook 1D MAX_InductionNumerical
#   - Conductivités électriques anisotropes : Grouve 2020, Table 1 (Solvay C/PEKK)
#   - Émissivité, convection : notebook 1D (ε=0.96, h=15) ; Grouve h=10 ; O'Shaughnessey h=5
# Les valeurs marquées "incertain" sont candidates à la calibration.

cf_pekk:
  densite: 1600.0            # kg/m3
  cp_base: 1200.0            # J/kg.K (hors pic de fusion)
  T_fusion: 337.0            # °C (PEKK)
  delta_T_fusion: 15.0       # °C — largeur du pic gaussien de fusion (DSC)
  chaleur_latente: 130000.0  # J/kg
  T_glass: 159.0             # °C (Tg, repère seulement)
  # Conductivité thermique du laminé homogénéisé quasi-iso [45/-45/0/90]3s
  k_plan: 3.0                # W/m.K — dans le plan (homogénéisé quasi-iso), incertain
  k_z: 0.64                  # W/m.K — transverse (Buser / CLAUDE.md vault)
  # Conductivités électriques d'un pli UD (Grouve 2020 Table 1, Solvay)
  sigma_0: 2.2e+4            # S/m — sens fibre
  sigma_90: 3.4              # S/m — travers fibre (intra-pli)
  sigma_z: 0.64              # S/m — transverse
  emissivite: 0.96

# Pli twill (sergé) suscepteur à l'interface de soudure : tissé => boucles
# conductrices fermées dans les deux directions => siège principal des courants
# de Foucault (hypothèse Série A, cahier de labo).
twill_suscepteur:
  # CORRECTION PRÉPARÉE (user 2026-07-27) : épaisseur MESURÉE = 0,20 mm (0.0002 m),
  # pas 0,28. À APPLIQUER à la prochaine recalibration (change la répartition de
  # puissance entre couches -> refit θ*). Valeur active laissée à 0.00028 pour
  # l'instant afin de ne pas confondre avec l'expérience thermostat 'capteurs' en
  # cours ; passer à 0.0002 en même temps que le refit.
  epaisseur: 0.00028         # m — ~2 CPT (tissé) ; MESURÉ 0.0002 (à appliquer, cf. ci-dessus)
  sigma_plan: 1.1e+4         # S/m — isotrope plan (ordre sigma_0/2, tissé équilibré), incertain
  facteur_couplage: 1.0      # facteur d'efficacité calibré (blindage, contacts fibre-fibre)

ceramique:
  epaisseur: 0.002           # m — Pamitherm, EM-transparente
  # Conductance de contact laminé -> céramique -> concentrateur.
  # O'Shaughnessey 2014 : bobine + concentrateur refroidis à l'eau, fixés à 20 °C
  # => la céramique agit comme un puits thermique vers T_puits.
  h_contact: 50.0            # W/m2.K, incertain (calibré, modèle 3D)
  T_puits: 20.0              # °C
  # Conductance TOP effective du modèle 2D lumpé dans l'épaisseur
  # (jumeau.thermique.solveur2d.SolveurThermique2D), sous l'empreinte MFC
  # active : remplace le rôle de h_contact mais absorbe aussi la conduction
  # à travers le demi-stack supérieur (plus de résolution en z côté 2D).
  # NOUVEAU (2026-07-20). Point de départ = dernière calibration 3D de
  # h_contact sur chauffe_250A_3TC (5.0, cf. scripts/calibrer.py docstring),
  # PAS une valeur calibrée pour le 2D — à recalibrer. Borne suggérée pour
  # la calibration à venir : [1, 50] W/m2.K (même enveloppe que h_contact).
  h_haut: 5.0                 # W/m2.K, incertain (point de départ, modèle 2D)

ambiant:
  T_amb: 20.0                # °C
  h_convection: 15.0         # W/m2.K — faces libres (notebook 1D ; litt. 5-15)
  h_bas: 15.0                # W/m2.K — face inférieure vers bâti/table, incertain (modèle 3D)
  stefan_boltzmann: 5.67e-8
  # Perte effective face inférieure/ambiant du modèle 2D lumpé dans
  # l'épaisseur (jumeau.thermique.solveur2d.SolveurThermique2D) : absorbe en
  # un seul coefficient la convection+rayonnement face inférieure ET la
  # conduction à travers le demi-stack inférieur du modèle 3D (plus de
  # résolution en z côté 2D) — distincte de h_bas, ne pas confondre.
  # NOUVEAU (2026-07-20). Point de départ = dernière calibration 3D de h_bas
  # sur chauffe_250A_3TC (50.919, cf. scripts/calibrer.py docstring), PAS
  # une valeur calibrée pour le 2D — à recalibrer. Borne suggérée pour la
  # calibration à venir : [2, 300] W/m2.K (même enveloppe que h_bas 3D).
  h_bas_2d: 50.919            # W/m2.K, incertain (point de départ, modèle 2D)
  # Puits de chaleur additionnel au chant x=0 SEUL du modèle 2D lumpé
  # (jumeau.thermique.solveur2d). Introduit comme "bridage/appui du montage sur
  # x=0" (calibré sur A-1, 250 W/m2.K), mais REQUALIFIÉ le 2026-07-27 :
  # l'utilisateur confirme que les QUATRE chants latéraux sont À L'AIR LIBRE
  # (aucune bride ni appui). => h_bord_x0 n'a AUCUNE base physique : c'est un
  # PARAMÈTRE EFFECTIF qui compense autre chose (vraisemblablement le bord trop
  # chaud du profil en "M" côté x=0). CANDIDAT AU RETRAIT à la prochaine
  # recalibration : tester h_bord_x0=0, ou le remplacer par une convection
  # latérale FAIBLE et UNIFORME sur les quatre chants (physique, symétrique).
  # Valeur active laissée à 250 pour l'instant (ne pas confondre avec
  # l'expérience thermostat 'capteurs' en cours). 0.0 = pas de puits.
  h_bord_x0: 250.0           # W/m2.K — EFFECTIF (pas physique, cf. ci-dessus), à retravailler
