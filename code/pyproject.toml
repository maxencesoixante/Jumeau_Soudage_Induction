[project]
name = "jumeau-soudage-induction"
version = "0.1.0"
description = "Simulation de l'empreinte thermique (coil hairpin + CFC) du soudage par induction de laminés CF/PEKK — jumeau numérique, maîtrise ÉTS"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # lecture/analyse des exports caméra thermique (vidéo MP4/AVI/MOV, frames) —
    # utilisé pour dépouiller les manips exp 6/8 (cf. data/exp6_diffusivite_*/).
    # NB : le radiométrique FLIR brut (.seq/.csq) demanderait flirpy + exiftool
    # (binaire système), non inclus ; préférer un export CSV radiométrique.
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",        # binaire ffmpeg embarqué (pas besoin du système)
    "opencv-python-headless>=4.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lents (simulations complètes) — exclure avec -m 'not slow'",
]
