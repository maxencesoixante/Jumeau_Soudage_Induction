# Essai exp7_150A — cartographie en largeur (profil « M »), AVEC céramique, 150 A.
# Source : data/exp7_bord-centre_2026-07-28_avec-ceramique/README.md — campagne
# CLOSE (2026-07-28), M symétrique validé. Fichier représentatif retenu (parmi
# 150A_v1/v2/v3, cf. ESSAIS_VALIDES de scripts/gen_figures_elsevier.py) :
# 150A_v3.txt (tab-séparé, décimale virgule ; auto-détecté par charger_mesures,
# aucune modification de chargement.py nécessaire).
#
# Protocole : chauffe CONTINUE à courant constant (PAS de multi-passes, pas de
# consigne/thermostat asservi) — coupure MANUELLE de l'opérateur au voisinage
# d'un pic bord ~270 °C (identique aux autres courants de la campagne, cf.
# README « chaque essai coupé au même pic ~270 °C » — donc le pic ABSOLU
# n'est PAS comparable entre courants, seuls la FORME et le taux de chauffe le
# sont). Modélisé par UN spot dont la fenêtre t_fin reproduit la durée de
# chauffe RÉELLE détectée (pas de consigne_interface : cf. Essai.source_fn,
# absence du champ -> source constante sur la fenêtre, ce qui est le
# comportement physique réel ici).
#
# Fenêtre de chauffe DÉTECTÉE (charger_mesures + recaler_a_la_chauffe, seuil
# dT/dt=1 °C/s par défaut) : onset ≈ t=0 (recalé) ; pic combiné (max sur les 5
# TC, bord TC1/TC5) atteint à t≈57.0 s -> t_fin=57.0 s modélise l'instant de
# coupure manuelle. Durée totale mesurée après recalage (fin de fichier,
# incluant le refroidissement) : 241.0 s.
# Pics mesurés (°C) : TC1=271.2 TC2=252.7 TC3=194.3 TC4=209.8 TC5=271.3
# (ambiant ≈ 29 °C) — documentés ici à titre indicatif (pas de consigne
# active), cf. taux_de_chauffe/delta_T_max de la confrontation pour la
# comparaison quantitative.
nom: exp7_150A
fichier_mesures: donnees/data/exp7_bord-centre_2026-07-28_avec-ceramique/150A/150A_v3.txt
courant: 150.0                # A
duree_chauffe: 57.0            # s (fenêtre de chauffe détectée, coupure manuelle)
duree_totale: 241.0            # s simulés (fenêtre + refroidissement mesuré)
spots:
  # Spot UNIQUE fixe, centré en longueur x=0.060 (= centre du montage 120 mm).
  # centre_y n'est pas un champ configurable du modèle (source_spot /
  # masque_empreinte_cfc centrent toujours en y sur largeur/2 = 0.020, cf.
  # geometrie.py) -- convention identique à serieA_A-1/A-3/serieB_B-2.
  - {centre_x: 0.060, t_debut: 0.0, t_fin: 57.0}
thermocouples:
  # 5 TC en LARGEUR à x=0.060 (droite bord->centre), tous à l'interface.
  # y=0/0.040 = chants (lobes chauds du profil « M »), y=0.020 = centre.
  TC1: {x: 0.060, y: 0.000, z: interface}
  TC2: {x: 0.060, y: 0.010, z: interface}
  TC3: {x: 0.060, y: 0.020, z: interface}   # centre de largeur
  TC4: {x: 0.060, y: 0.030, z: interface}
  TC5: {x: 0.060, y: 0.040, z: interface}
tc_valides: [TC1, TC2, TC3, TC4, TC5]
