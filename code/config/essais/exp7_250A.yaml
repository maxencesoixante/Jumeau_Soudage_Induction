# Essai exp7_250A — cartographie en largeur (profil « M »), AVEC céramique, 250 A.
# Source : data/exp7_bord-centre_2026-07-28_avec-ceramique/README.md — campagne
# CLOSE (2026-07-28), M symétrique validé. Fichier représentatif retenu
# (parmi 250A_v1/v2/v3, cf. ESSAIS_VALIDES de scripts/gen_figures_elsevier.py) :
# 250A_v3.txt (tab-séparé, décimale virgule ; auto-détecté par
# charger_mesures, aucune modification nécessaire).
#
# Protocole : identique à exp7_150A/200A (chauffe continue à courant
# constant, coupure MANUELLE au voisinage d'un pic bord ~265-272 °C, pas de
# consigne). À 250 A le pic est atteint très vite (~10 s, cf. taux de chauffe
# bord 34,2 °C/s de la campagne).
#
# Fenêtre de chauffe DÉTECTÉE : onset ≈ t=0 (recalé) ; pic combiné (bord
# TC1/TC5) atteint à t≈10.0 s -> t_fin=10.0 s. Durée totale mesurée après
# recalage : 101.0 s.
# Pics mesurés (°C) : TC1=271.7 TC2=207.2 TC3=142.4 TC4=180.3 TC5=265.6
# (ambiant ≈ 28.8 °C) — indicatif (pas de consigne active).
nom: exp7_250A
fichier_mesures: donnees/data/exp7_bord-centre_2026-07-28_avec-ceramique/250A/250A_v3.txt
courant: 250.0                # A
duree_chauffe: 10.0             # s (fenêtre de chauffe détectée, coupure manuelle)
duree_totale: 101.0             # s simulés (fenêtre + refroidissement mesuré)
spots:
  # Spot UNIQUE fixe, centré en longueur x=0.060. centre_y implicite =
  # largeur/2 = 0.020 (non configurable, cf. exp7_150A.yaml).
  - {centre_x: 0.060, t_debut: 0.0, t_fin: 10.0}
thermocouples:
  TC1: {x: 0.060, y: 0.000, z: interface}
  TC2: {x: 0.060, y: 0.010, z: interface}
  TC3: {x: 0.060, y: 0.020, z: interface}   # centre de largeur
  TC4: {x: 0.060, y: 0.030, z: interface}
  TC5: {x: 0.060, y: 0.040, z: interface}
tc_valides: [TC1, TC2, TC3, TC4, TC5]
