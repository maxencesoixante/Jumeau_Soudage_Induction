name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (core deps) + pytest
        run: |
          python -m pip install --upgrade pip
          # Les tests n'utilisent pas les deps lourdes (opencv/imageio) du groupe
          # dev ; on installe seulement le cœur + pytest pour une CI rapide.
          pip install -e .
          pip install "pytest>=8.0"

      - name: Run test suite
        run: pytest -q
