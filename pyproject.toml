[project]
name = "jumeau-soudage-induction"
version = "0.1.0"
description = "Simulation de l'empreinte thermique (coil hairpin + CFC) du soudage par induction de laminés CF/PEKK — jumeau numérique, maîtrise ÉTS"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
